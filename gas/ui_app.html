<script>
  const $ = (id) => document.getElementById(id);

  // UIマスタデータ（カテゴリ/支払方法）
  let MASTER = null;

  /* ========== キャッシュ管理（体感速度改善） ========== */

  const CACHE_PREFIX = "kakeibo_";
  const CACHE_TTL = 5 * 60 * 1000; // 5分

  /**
   * キャッシュに保存
   */
  function setCache_(key, data) {
    try {
      const item = {
        data: data,
        timestamp: Date.now()
      };
      sessionStorage.setItem(CACHE_PREFIX + key, JSON.stringify(item));
    } catch (e) {
      console.warn("Cache write failed:", e);
    }
  }

  /**
   * キャッシュから取得（TTL考慮）
   */
  function getCache_(key, ignoreTTL = false) {
    try {
      const raw = sessionStorage.getItem(CACHE_PREFIX + key);
      if (!raw) return null;
      const item = JSON.parse(raw);
      if (!ignoreTTL && Date.now() - item.timestamp > CACHE_TTL) {
        return null; // 期限切れ
      }
      return item.data;
    } catch (e) {
      return null;
    }
  }

  /**
   * キャッシュを削除
   */
  function clearCache_(key) {
    try {
      if (key) {
        sessionStorage.removeItem(CACHE_PREFIX + key);
      } else {
        // 全キャッシュクリア
        Object.keys(sessionStorage).forEach(k => {
          if (k.startsWith(CACHE_PREFIX)) {
            sessionStorage.removeItem(k);
          }
        });
      }
    } catch (e) {}
  }

  /**
   * 履歴キャッシュキーを生成
   */
  function historyKey_(month, filters) {
    const f = filters || {};
    return `history_${month}_${f.status || ""}_${f.category || ""}_${f.payment_method || ""}`;
  }

  /* ========== 共通ユーティリティ ========== */

  /**
   * クライアントコンテキスト（二重送信防止用）
   */
  function clientContext_() {
    return {
      client_request_id: generateUUID_(),
      client_time: new Date().toISOString(),
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Tokyo",
      device: "mobile",
      ui_version: "0.9"
    };
  }

  /**
   * UUID生成
   */
  function generateUUID_() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
      const r = Math.random() * 16 | 0;
      const v = c === "x" ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  /**
   * 今日の日付をISO形式で取得
   */
  function getTodayISO_() {
    const d = new Date();
    const y = d.getFullYear();
    const m = ("0" + (d.getMonth() + 1)).slice(-2);
    const day = ("0" + d.getDate()).slice(-2);
    return `${y}-${m}-${day}`;
  }

  /**
   * 画像をリサイズしてdataURLに変換
   */
  function resizeImageToDataUrl_(file, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();

      reader.onload = () => { img.src = reader.result; };
      reader.onerror = reject;

      img.onload = () => {
        const w = img.width;
        const h = img.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        const nw = Math.round(w * scale);
        const nh = Math.round(h * scale);

        const canvas = document.createElement("canvas");
        canvas.width = nw;
        canvas.height = nh;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, nw, nh);

        const out = canvas.toDataURL("image/jpeg", quality);
        resolve(out);
      };
      img.onerror = reject;

      reader.readAsDataURL(file);
    });
  }

  /**
   * selectを文字列配列で構築（[object Object]問題を解消）
   */
  function fillSelect_(selectEl, items, placeholder) {
    if (!selectEl) return;
    selectEl.innerHTML = "";

    const ph = document.createElement("option");
    ph.value = "";
    ph.textContent = placeholder || "選択してください";
    selectEl.appendChild(ph);

    items.forEach(item => {
      // itemがobjectでも安全に文字列を取り出す
      const label = (typeof item === "string") ? item : (item.label || item.name || item.category || item.value || String(item));
      const value = (typeof item === "string") ? item : (item.value || item.id || label);

      if (!label) return;
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label; // ここで必ず文字列
      selectEl.appendChild(opt);
    });
  }

  /* ========== ホームタブ（カメラ/音声/フォーム統合） ========== */

  /**
   * ホームステータス表示
   */
  function setHomeStatus(msg) {
    const el = $("homeStatus");
    if (el) el.textContent = msg;
  }

  /**
   * OCRステータス表示
   */
  function setOcrStatus(msg, type) {
    const el = $("ocrStatus");
    if (el) {
      el.textContent = msg;
      el.className = "hint " + (type || "");
    }
  }

  /**
   * カメラ/写真からのファイル処理 → フォームに反映
   */
  async function handleReceiptFile_(file, source) {
    if (!file) return;

    setOcrStatus("画像を準備しています...", "processing");

    try {
      const dataUrl = await resizeImageToDataUrl_(file, 1280, 0.75);
      setOcrStatus("レシートを解析中...", "processing");

      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.ok) {
            setOcrStatus("解析に失敗しました。手入力してください。", "error");
            return;
          }
          applyDraftToHomeForm_(res.result.draft);
          setOcrStatus("読み取り完了！内容を確認して保存してください", "success");
        })
        .withFailureHandler((err) => {
          setOcrStatus("エラー: " + (err?.message || String(err)), "error");
        })
        .processReceiptV2(dataUrl, clientContext_());

    } catch (e) {
      setOcrStatus("画像処理に失敗しました", "error");
    }
  }

  /**
   * ドラフトをホームフォームに反映
   */
  function applyDraftToHomeForm_(draft) {
    if (!draft) return;

    const dateEl = $("inputDate");
    const amtEl = $("inputAmount");
    const merEl = $("inputMerchant");
    const memoEl = $("inputMemo");
    const catEl = $("inputCategory");
    const payEl = $("inputPayment");

    if (dateEl && draft.date) dateEl.value = draft.date;
    if (amtEl && draft.amount) amtEl.value = draft.amount;
    if (merEl && draft.merchant) merEl.value = draft.merchant;
    if (catEl && draft.category) catEl.value = draft.category;
    if (payEl && draft.payment_method) payEl.value = draft.payment_method;

    // 重要: AI整形後のmemoを使用（raw_textは使わない）
    // これにより「この内容でOK」後の保存でAI整形メモが保存される
    if (memoEl && draft.memo) {
      memoEl.value = draft.memo;
    }
  }

  /**
   * ホームフォームから保存
   * LAST_AI_DRAFTがある場合は、AI判定のtxn_type（expense/income/fixed_cost）を引き継ぐ
   */
  function saveFromHome() {
    const amount = Number($("inputAmount")?.value);
    if (!amount || amount <= 0) {
      setHomeStatus("金額を入力してください");
      return;
    }

    // AI判定のtxn_typeを引き継ぐ（LAST_AI_DRAFTがある場合）
    const txnType = LAST_AI_DRAFT?.txn_type || "expense";
    const type = LAST_AI_DRAFT?.type || (txnType === "income" ? "income" : "expense");

    const draft = {
      date: $("inputDate")?.value || getTodayISO_(),
      txn_type: txnType,  // AI判定タイプを含める
      type: type,         // シート保存用タイプ
      amount: amount,
      merchant: $("inputMerchant")?.value || "",
      category: $("inputCategory")?.value || "",
      subcategory: "",
      payment_method: $("inputPayment")?.value || "",
      memo: $("inputMemo")?.value || "",
      raw_text: LAST_AI_DRAFT?.raw_text || "",
      confidence: 0
    };

    const btn = $("btnSaveHome");
    if (btn) btn.disabled = true;
    setHomeStatus("保存中...");

    // デバッグ: 保存直前の情報を確認
    console.log("[saveFromHome] txn_type =", draft.txn_type, ", memo =", draft.memo);

    google.script.run
      .withSuccessHandler((res) => {
        if (btn) btn.disabled = false;

        if (!res || !res.ok) {
          setHomeStatus("保存失敗: " + (res?.error?.user_message || "エラー"));
          return;
        }

        const t = res.result.transaction;
        setHomeStatus(`保存しました！ (ID: ${t.id})`);

        setTimeout(() => {
          clearHomeForm();
          setHomeStatus("音声で話しかけると自動入力できます");
        }, 2000);
      })
      .withFailureHandler((e) => {
        if (btn) btn.disabled = false;
        setHomeStatus("エラー: " + (e?.message || String(e)));
      })
      .saveTransactionDraft(draft, clientContext_());
  }

  /**
   * ホームフォームをクリア＆非表示
   */
  function clearHomeForm() {
    if ($("inputDate")) $("inputDate").value = getTodayISO_();
    if ($("inputAmount")) $("inputAmount").value = "";
    if ($("inputMerchant")) $("inputMerchant").value = "";
    if ($("inputCategory")) $("inputCategory").value = "";
    if ($("inputPayment")) $("inputPayment").value = "";
    if ($("inputMemo")) $("inputMemo").value = "";
    if ($("chatInput")) $("chatInput").value = "";

    // フォームを非表示に戻す
    const formWrap = $("txnFormWrap");
    if (formWrap) formWrap.style.display = "none";

    // AIプレビューを非表示
    const previewCard = $("aiPreviewCard");
    if (previewCard) previewCard.style.display = "none";

    LAST_AI_DRAFT = null;
  }

  /* ========== 音声入力 ========== */

  let recognition = null;
  let listening = false;

  /**
   * 音声入力のセットアップ（音声ファースト版）
   */
  function setupVoiceInput_() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const btn = $("btnMic");

    if (!SR || !btn) {
      if (btn) {
        btn.disabled = true;
        const iconEl = btn.querySelector(".voiceIcon");
        const labelEl = btn.querySelector(".voiceLabel");
        if (labelEl) labelEl.textContent = "非対応";
      }
      return;
    }

    recognition = new SR();
    recognition.lang = "ja-JP";
    recognition.interimResults = false;  // 確定結果のみ取得（途中結果で揺れない）
    recognition.continuous = false;

    recognition.onstart = () => {
      listening = true;
      btn.classList.add("listening");
      const labelEl = btn.querySelector(".voiceLabel");
      if (labelEl) labelEl.textContent = "録音中...";
      // chatInputをクリア
      $("chatInput").value = "";
    };

    recognition.onresult = (e) => {
      // 確定結果のみ取得
      let finalText = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        finalText += e.results[i][0].transcript;
      }
      $("chatInput").value = finalText.trim();
    };

    recognition.onend = () => {
      listening = false;
      btn.classList.remove("listening");
      const labelEl = btn.querySelector(".voiceLabel");
      if (labelEl) labelEl.textContent = "話して入力";

      // 自動送信しない（送信ボタン押下のみ）
      // テキストがあれば確認メッセージ
      const text = ($("chatInput").value || "").trim();
      if (text) {
        pushChat_("user", `🎤 ${text}`);
        pushChat_("ai", "内容を確認して「送信」を押してください。修正も可能です。");
      }
    };

    recognition.onerror = (e) => {
      listening = false;
      btn.classList.remove("listening");
      const labelEl = btn.querySelector(".voiceLabel");
      if (labelEl) labelEl.textContent = "話して入力";
      removeLast_();

      if (e.error === "not-allowed") {
        pushChat_("ai", "マイク権限が必要です。ブラウザ設定をご確認ください。");
      } else if (e.error !== "aborted" && e.error !== "no-speech") {
        pushChat_("ai", "音声入力に失敗しました。");
      }
    };

    btn.addEventListener("click", () => {
      if (listening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });
  }

  /**
   * 音声テキストから金額/店名を抽出
   */
  function parseSpeechToDraft_(text) {
    const t = (text || "").trim();
    if (!t) return {};

    // 金額: "620円" "620 えん" "1,500円" など
    const m = t.match(/([\d,]+)\s*(円|えん)/);
    const amount = m ? Number(m[1].replace(/,/g, "")) : 0;

    // 店名: 金額の前の部分をざっくり店名/内容扱い
    let merchant = "";
    if (m) {
      merchant = t.slice(0, m.index).trim();
    } else {
      merchant = t;
    }

    return { merchant, amount };
  }

  /**
   * 音声認識結果をフォームに反映
   */
  function applyVoiceToForm_() {
    const t = $("voiceText")?.value?.trim();
    if (!t) return;

    // 金額/店名を抽出してフォームに反映
    const d = parseSpeechToDraft_(t);

    if (d.merchant && $("inputMerchant")) {
      $("inputMerchant").value = d.merchant;
    }
    if (d.amount && $("inputAmount")) {
      $("inputAmount").value = d.amount;
    }

    // rawとしてメモにも残す
    const memoEl = $("inputMemo");
    if (memoEl) {
      memoEl.value = memoEl.value ? memoEl.value + " / " + t : t;
    }

    setOcrStatus("音声からフォームに反映しました", "success");
  }

  /**
   * 音声入力をクリア
   */
  function clearVoice_() {
    // 現在はchatInputを使用しているため特別な処理不要
  }

  /* ========== AIチャット受付 ========== */

  let LAST_AI_DRAFT = null;

  /**
   * AI状態を確認
   */
  function checkAiStatus_() {
    const el = $("aiStatus");
    if (el) el.textContent = "確認中…";

    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.ok) {
          if (el) el.textContent = "AI状態取得に失敗しました";
          return;
        }
        const r = res.result;
        if (el) el.textContent = `AI=${r.aiEnabled} / KEY=${r.hasKey} / ${r.modelText}`;
      })
      .withFailureHandler((e) => {
        if (el) el.textContent = "エラー: " + (e && e.message ? e.message : String(e));
      })
      .debugAiStatus();
  }

  /**
   * チャット送信
   */
  function sendChat_() {
    const input = $("chatInput");
    const text = (input?.value || "").trim();
    if (!text) return;

    pushChat_("user", text);
    input.value = "";

    pushChat_("ai", "解析中…");

    google.script.run
      .withSuccessHandler((res) => {
        // 最後の「解析中…」を消す
        removeLast_();

        if (!res || !res.ok) {
          pushChat_("ai", "AI解析に失敗しました。手入力で続行できます。");
          return;
        }
        LAST_AI_DRAFT = res.result.draft;

        // 精算取引の場合、精算モーダルを表示
        if (res.result.settlement) {
          pushChat_("ai", "カード精算を認識しました。内容を確認してください。");
          showSettlementModal(res.result.settlement);
          return;
        }

        showAiPreview_(LAST_AI_DRAFT, res.result.aiUsed);
        pushChat_("ai", buildAiSummary_(LAST_AI_DRAFT));
      })
      .withFailureHandler((e) => {
        removeLast_();
        pushChat_("ai", "AI解析エラー: " + (e && e.message ? e.message : String(e)));
      })
      .processSmartInput(text, clientContext_());
  }

  /**
   * チャットにメッセージ追加
   */
  function pushChat_(role, text) {
    const box = $("chatBox");
    if (!box) return;

    const wrap = document.createElement("div");
    wrap.className = "msg " + role;

    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;

    wrap.appendChild(b);
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
  }

  /**
   * 最後のメッセージを削除
   */
  function removeLast_() {
    const box = $("chatBox");
    if (box && box.lastChild) {
      box.removeChild(box.lastChild);
    }
  }

  /**
   * 取引タイプのラベルを取得
   */
  function getTxnTypeLabel_(txnType) {
    const labels = {
      "expense": "支出（変動費）",
      "income": "収入",
      "fixed_cost": "固定費"
    };
    return labels[txnType] || "支出";
  }

  /**
   * AI結果をサマリー文字列に
   */
  function buildAiSummary_(d) {
    const parts = [];
    // 取引タイプを最初に表示
    if (d.txn_type && d.txn_type !== "expense") {
      parts.push(`【${getTxnTypeLabel_(d.txn_type)}】`);
    }
    if (d.merchant) parts.push(`店名: ${d.merchant}`);
    if (d.amount) parts.push(`金額: ${d.amount}円`);
    if (d.category) parts.push(`カテゴリ: ${d.category}`);
    if (d.payment_method) parts.push(`支払: ${d.payment_method}`);
    return parts.length ? parts.join(" / ") + "\n→「この内容でOK」を押してください" : "内容を確認してください";
  }

  /**
   * AIプレビュー表示
   */
  function showAiPreview_(draft, aiUsed) {
    const card = $("aiPreviewCard");
    const body = $("aiPreviewBody");
    const hint = $("aiPreviewHint");

    if (!card || !body) return;

    // 取引タイプを表示
    const txnTypeLabel = getTxnTypeLabel_(draft.txn_type);

    const rows = [
      ["種別", txnTypeLabel],
      ["日付", draft.date || ""],
      ["金額", draft.amount || 0],
      ["店名/内容", draft.merchant || ""],
      ["カテゴリ", draft.category || "(未設定)"],
      ["支払方法", draft.payment_method || "(未設定)"],
      ["メモ", (draft.memo || "").slice(0, 200)]
    ];

    body.innerHTML = rows.map(([k, v]) => {
      // 種別は強調表示
      const valueClass = k === "種別" ? "v txn-type-" + (draft.txn_type || "expense") : "v";
      return `<div class="kv"><div class="k">${escapeHtml_(k)}</div><div class="${valueClass}">${escapeHtml_(String(v))}</div></div>`;
    }).join("");

    if (hint) {
      let hintText = aiUsed
        ? "AI推定です。必要ならフォームで修正できます。"
        : "AI無効のため簡易推定です。フォームで修正してください。";
      // 固定費の場合は追加説明
      if (draft.txn_type === "fixed_cost") {
        hintText += "\n※固定費は自動的に固定費マスタにも登録されます。";
      }
      hint.textContent = hintText;
    }

    card.style.display = "block";
    card.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /**
   * AIプレビューやり直し
   */
  function retryAi_() {
    const card = $("aiPreviewCard");
    if (card) card.style.display = "none";
    LAST_AI_DRAFT = null;
  }

  /**
   * AI確定 -> フォーム展開 -> 反映
   */
  function acceptAiDraft_() {
    if (!LAST_AI_DRAFT) return;

    // フォームを展開
    openManualForm_();

    // ドラフトを反映
    applyDraftToHomeForm_(LAST_AI_DRAFT);

    const card = $("aiPreviewCard");
    if (card) card.style.display = "none";

    // フォーム位置へスクロール
    const formWrap = $("txnFormWrap");
    if (formWrap) formWrap.scrollIntoView({ behavior: "smooth", block: "start" });

    setHomeStatus("フォームに反映しました。確認して「確定して保存」を押してください");
  }

  /**
   * 手入力フォームをトグル表示
   */
  function toggleManual_() {
    const wrap = $("txnFormWrap");
    if (!wrap) return;

    const isHidden = wrap.style.display === "none" || !wrap.style.display;
    wrap.style.display = isHidden ? "block" : "none";

    if (isHidden) {
      // 日付を今日に設定
      if ($("inputDate")) $("inputDate").value = getTodayISO_();
      wrap.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  /**
   * 手入力フォームを開く
   */
  function openManualForm_() {
    const wrap = $("txnFormWrap");
    if (!wrap) return;
    wrap.style.display = "block";
    // 日付を今日に設定
    if ($("inputDate")) $("inputDate").value = getTodayISO_();
  }

  /**
   * チャット履歴をクリア
   */
  function clearChat_() {
    const box = $("chatBox");
    if (box) box.innerHTML = "";
  }

  /**
   * 写真/カメラ -> OCR -> AIへ送る
   */
  async function handleReceiptToAi_(file, source) {
    if (!file) return;

    pushChat_("user", source === "camera" ? "📷 レシート撮影" : "🖼 レシート選択");
    pushChat_("ai", "OCR解析中…");

    try {
      const dataUrl = await resizeImageToDataUrl_(file, 1280, 0.75);

      google.script.run
        .withSuccessHandler((res) => {
          removeLast_();

          if (!res || !res.ok) {
            pushChat_("ai", "OCRに失敗しました。手入力で続行できます。");
            return;
          }
          const d = res.result.draft || {};
          // OCR文字列をAIに渡す
          const text = (d.raw_text || d.memo || "").trim();
          if (!text) {
            pushChat_("ai", "OCR結果が空でした。手入力で続行できます。");
            return;
          }
          $("chatInput").value = text.slice(0, 800);
          sendChat_();
        })
        .withFailureHandler((e) => {
          removeLast_();
          pushChat_("ai", "OCRエラー: " + (e && e.message ? e.message : String(e)));
        })
        .processReceiptV2(dataUrl, clientContext_());

    } catch (e) {
      removeLast_();
      pushChat_("ai", "画像処理に失敗しました。");
    }
  }

  /**
   * HTML特殊文字エスケープ
   */
  function escapeHtml_(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /* ========== 入力タブ（手入力専用） ========== */

  /**
   * フォームステータス表示
   */
  function setFormStatus(msg) {
    const el = $("formStatus");
    if (el) el.textContent = msg;
  }

  /**
   * 入力タブから保存（Optimistic UI対応）
   * 0.2秒以内にUIが反応するように設計
   */
  function saveDraft() {
    const amount = Number($("formAmount")?.value);
    if (!amount || amount <= 0) {
      setFormStatus("金額を入力してください");
      return;
    }

    const draft = {
      date: $("formDate")?.value || getTodayISO_(),
      amount: amount,
      merchant: $("formMerchant")?.value || "",
      category: $("formCategory")?.value || "",
      subcategory: "",
      payment_method: $("formPayment")?.value || "",
      memo: $("formMemo")?.value || "",
      raw_text: "",
      confidence: 0
    };

    const btn = $("btnSaveDraft");

    // ====== Optimistic UI: 即時フィードバック ======
    if (btn) {
      btn.disabled = true;
      btn.textContent = "✓ 保存しました";
      btn.classList.add("btn-success");
    }
    setFormStatus("保存しました");

    // キャッシュを無効化（次回loadHistoryで最新データを取得）
    clearCache_();

    // フォームを即クリア（体感速度向上）
    setTimeout(() => {
      clearForm();
      if (btn) {
        btn.textContent = "保存";
        btn.classList.remove("btn-success");
      }
    }, 800);

    // ====== バックグラウンドで実際の保存処理 ======
    google.script.run
      .withSuccessHandler((res) => {
        if (btn) btn.disabled = false;

        if (!res || !res.ok) {
          // 保存失敗: エラー表示（稀なケース）
          setFormStatus("保存失敗: " + (res?.error?.user_message || "エラー"));
          if (btn) {
            btn.textContent = "保存";
            btn.classList.remove("btn-success");
          }
          return;
        }

        // 成功（すでにUIは更新済みなので何もしない）
        console.log("Transaction saved:", res.result.transaction?.id);
      })
      .withFailureHandler((e) => {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "保存";
          btn.classList.remove("btn-success");
        }
        setFormStatus("エラー: " + (e?.message || String(e)) + "（再試行してください）");
      })
      .saveTransactionDraft(draft, clientContext_());
  }

  /**
   * 入力タブフォームをクリア
   */
  function clearForm() {
    if ($("formDate")) $("formDate").value = getTodayISO_();
    if ($("formAmount")) $("formAmount").value = "";
    if ($("formMerchant")) $("formMerchant").value = "";
    if ($("formCategory")) $("formCategory").value = "";
    if ($("formPayment")) $("formPayment").value = "";
    if ($("formMemo")) $("formMemo").value = "";
    setFormStatus("入力してください");
  }

  /* ========== タブ・履歴・編集 ========== */

  let currentMonthStart = getCurrentMonthStart();

  function getCurrentMonthStart() {
    const now = new Date();
    const y = now.getFullYear();
    const m = ("0" + (now.getMonth() + 1)).slice(-2);
    return `${y}-${m}-01`;
  }

  function switchTab(tabName) {
    document.querySelectorAll(".tab").forEach(t => {
      t.classList.toggle("active", t.dataset.tab === tabName);
    });

    document.querySelectorAll(".tab-content").forEach(c => {
      c.classList.toggle("active", c.id === `tab-${tabName}`);
    });

    if (tabName === "history") {
      loadHistory();
    }
    if (tabName === "analytics") {
      loadDashboard();
    }
  }

  function changeMonth(delta) {
    const d = new Date(currentMonthStart);
    d.setMonth(d.getMonth() + delta);
    const y = d.getFullYear();
    const m = ("0" + (d.getMonth() + 1)).slice(-2);
    currentMonthStart = `${y}-${m}-01`;
    $("currentMonth").textContent = `${y}-${m}`;
    loadHistory();
  }

  function loadHistory() {
    const statusFilter = $("statusFilter")?.value || "";
    const categoryFilter = $("categoryFilter")?.value || "";
    const paymentFilter = $("paymentFilter")?.value || "";
    const queryFilter = $("queryFilter")?.value?.trim() || "";

    const filters = {};
    if (statusFilter) filters.status = statusFilter;
    if (categoryFilter) filters.category = categoryFilter;
    if (paymentFilter) filters.payment_method = paymentFilter;
    if (queryFilter) filters.query = queryFilter;
    filters.includeUndated = false;  // 日付未設定は非表示

    // フィルタ情報を保存（サマリー用）
    const filterLabels = {
      month: currentMonthStart,
      status: statusFilter,
      category: categoryFilter,
      payment: paymentFilter,
      query: queryFilter
    };

    const cacheKey = historyKey_(currentMonthStart, filters);

    // ====== 段階1: キャッシュから即時表示（0.2秒以内に視覚変化） ======
    const cached = getCache_(cacheKey, true); // TTL無視でも表示
    if (cached && cached.rows) {
      renderHistoryData_(cached.rows, queryFilter, filterLabels, true);
    }

    // ローディング表示（キャッシュがない場合のみフルローディング）
    if (!cached) {
      $("historyLoading").style.display = "block";
      $("historyList").innerHTML = "";
    }
    $("historyEmpty").style.display = "none";

    // ====== 段階2: サーバーから最新データを取得 ======
    google.script.run
      .withSuccessHandler((res) => {
        $("historyLoading").style.display = "none";

        if (!res || !res.ok) {
          // キャッシュがあればそのまま維持、なければエラー表示
          if (!cached) {
            $("historyEmpty").style.display = "block";
            $("historyEmpty").textContent = res?.error?.user_message || "読み込みに失敗しました";
            updateHistorySummary_([], filterLabels);
          }
          return;
        }

        const { rows } = res.result;

        // キャッシュに保存
        setCache_(cacheKey, { rows: rows });

        // ====== 段階3: 最新データで更新 ======
        renderHistoryData_(rows, queryFilter, filterLabels, false);
      })
      .withFailureHandler((e) => {
        $("historyLoading").style.display = "none";
        // キャッシュがあればそのまま維持
        if (!cached) {
          $("historyEmpty").style.display = "block";
          $("historyEmpty").textContent = "読み込みエラー: " + (e?.message || String(e));
          updateHistorySummary_([], filterLabels);
        }
      })
      .listTransactions(currentMonthStart, filters);
  }

  /**
   * 履歴データを描画（共通処理）
   * @param {Array} rows - 取引データ
   * @param {string} queryFilter - 検索クエリ
   * @param {Object} filterLabels - フィルタラベル
   * @param {boolean} isStale - キャッシュデータかどうか
   */
  function renderHistoryData_(rows, queryFilter, filterLabels, isStale) {
    if (rows && rows.length > 0) {
      // クライアント側でもフィルタリング（query検索）
      let filtered = rows;
      if (queryFilter) {
        const q = queryFilter.toLowerCase();
        filtered = rows.filter(txn =>
          (txn.merchant || "").toLowerCase().includes(q) ||
          (txn.item || "").toLowerCase().includes(q) ||
          (txn.memo || "").toLowerCase().includes(q)
        );
      }

      // サマリー更新
      updateHistorySummary_(filtered, filterLabels);

      if (filtered.length > 0) {
        $("historyList").innerHTML = filtered.map(renderHistoryCard).join("");
        $("historyEmpty").style.display = "none";
      } else {
        $("historyEmpty").style.display = "block";
        $("historyEmpty").textContent = "該当する取引がありません";
      }
    } else {
      updateHistorySummary_([], filterLabels);
      $("historyEmpty").style.display = "block";
      $("historyEmpty").textContent = "該当する取引がありません";
    }
  }

  let searchTimeout = null;

  function debounceSearch() {
    if (searchTimeout) clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      loadHistory();
    }, 300);
  }

  /**
   * フィルタ状態からサマリーのラベルを生成
   */
  function buildSummaryLabels_(filters) {
    const statusLabels = {
      pending: "未確定",
      needs_review: "要確認",
      confirmed: "確定済み"
    };

    const parts = [];

    // 優先順：カテゴリ → 支払い方法 → ステータス
    if (filters.category) parts.push(filters.category);
    if (!parts.length && filters.payment) parts.push(filters.payment);
    if (!parts.length && filters.status) parts.push(statusLabels[filters.status] || filters.status);

    // 月表示（YYYY-MM形式）
    const monthLabel = filters.month ? filters.month.slice(0, 7) : "";

    const title = parts.length
      ? `${parts.join(" / ")} 合計`
      : (monthLabel ? `${monthLabel} の合計` : "合計金額");

    // サブ：条件の説明
    const subParts = [];
    if (filters.query) subParts.push(`検索: ${filters.query}`);
    if (filters.category && parts[0] !== filters.category) subParts.push(`カテゴリ: ${filters.category}`);
    if (filters.payment && parts[0] !== filters.payment) subParts.push(`支払: ${filters.payment}`);
    if (filters.status && parts[0] !== (statusLabels[filters.status] || filters.status)) {
      subParts.push(`状態: ${statusLabels[filters.status] || filters.status}`);
    }

    const sub = subParts.join(" / ");
    return { title, sub };
  }

  /**
   * 履歴サマリーを更新（支出・収入・件数）
   * 重要: 支出と収入を分けて集計（混ぜない）
   */
  function updateHistorySummary_(transactions, filters) {
    const txns = transactions || [];

    // 支出と収入を分けて集計（type === "expense" / "income"）
    const expenseSum = txns
      .filter(t => t.type === "expense")
      .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
    const incomeSum = txns
      .filter(t => t.type === "income")
      .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);

    const expenseCount = txns.filter(t => t.type === "expense").length;
    const incomeCount = txns.filter(t => t.type === "income").length;
    const totalCount = txns.length;

    const labels = buildSummaryLabels_(filters);

    const sumTitle = $("sumTitle");
    const sumSub = $("sumSub");
    const sumExpense = $("sumExpense");
    const sumIncome = $("sumIncome");
    const sumCount = $("sumCount");

    if (sumTitle) sumTitle.textContent = labels.title;
    if (sumSub) sumSub.textContent = labels.sub || "";

    // 支出合計（赤系表示）
    if (sumExpense) sumExpense.textContent = `¥${expenseSum.toLocaleString()}`;

    // 収入合計（緑系表示）
    if (sumIncome) sumIncome.textContent = `¥${incomeSum.toLocaleString()}`;

    // 件数（内訳付き）
    if (sumCount) {
      if (incomeCount > 0 || expenseCount !== totalCount) {
        sumCount.textContent = `${totalCount}件（支出${expenseCount}件・収入${incomeCount}件）`;
      } else {
        sumCount.textContent = `${totalCount}件`;
      }
    }
  }

  function renderHistoryCard(txn) {
    const dateDisplay = txn.date || "日付未確定";
    const statusLabel = {
      confirmed: "確定",
      pending: "未確定",
      needs_review: "要確認"
    }[txn.status] || txn.status;

    // 固定費判定（source="fixed_cost" または tags に "fixed_cost" を含む）
    const isFixedCost = txn.source === "fixed_cost" ||
                        (txn.tags && String(txn.tags).includes("fixed_cost"));

    // 収入/支出/固定費バッジ
    const isIncome = txn.type === "income";
    let typeLabel, typeBadgeClass;
    if (isIncome) {
      typeLabel = "収入";
      typeBadgeClass = "badge-income";
    } else if (isFixedCost) {
      typeLabel = "固定費";
      typeBadgeClass = "badge-fixed";
    } else {
      typeLabel = "支出";
      typeBadgeClass = "badge-expense";
    }

    // 金額表示（収入は+、支出は-）
    const amountSign = isIncome ? "+" : "-";
    const amountClass = isIncome ? "history-amount income" : "history-amount expense";

    // カード全体のスタイル
    let cardClass = "history-card";
    if (isIncome) cardClass += " income-card";
    else if (isFixedCost) cardClass += " fixed-card";

    const txnJson = JSON.stringify(txn).replace(/'/g, "&#39;").replace(/"/g, "&quot;");

    return `
      <div class="${cardClass}">
        <div class="history-card-row1">
          <span class="history-date">${escapeHtml_(dateDisplay)}</span>
          <span class="badge ${typeBadgeClass}">${typeLabel}</span>
          <span class="badge badge-${txn.status}">${statusLabel}</span>
        </div>
        <div class="history-card-row2">
          ${escapeHtml_(txn.merchant || txn.item || "(詳細なし)")}
        </div>
        <div class="history-card-row3">
          ${escapeHtml_(txn.category)}${txn.subcategory ? " / " + escapeHtml_(txn.subcategory) : ""}
        </div>
        <div class="${amountClass}">${amountSign}¥${txn.amount.toLocaleString()}</div>
        <div class="history-card-actions">
          <button class="btn-edit" onclick='openEditModal(${txnJson})'>編集</button>
          <button class="btn-delete" onclick='confirmDelete("${txn.id}")'>削除</button>
        </div>
      </div>
    `;
  }

  function confirmDelete(id) {
    if (!confirm("この取引を削除しますか？")) return;
    deleteTransaction(id);
  }

  function deleteTransaction(id) {
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.ok) {
          loadHistory();
        } else {
          alert(res?.error?.user_message || "削除に失敗しました");
        }
      })
      .withFailureHandler((e) => {
        alert("エラー: " + (e?.message || String(e)));
      })
      .deleteTransaction(id);
  }

  function openEditModal(txn) {
    $("editId").value = txn.id;
    $("editDate").value = txn.date || "";
    $("editAmount").value = txn.amount || "";
    $("editCategory").value = txn.category || "";
    $("editSubcategory").value = txn.subcategory || "";
    $("editPaymentMethod").value = txn.payment_method || "";
    $("editMerchant").value = txn.merchant || "";
    $("editItem").value = txn.item || "";
    $("editMemo").value = txn.memo || "";
    $("editTags").value = txn.tags || "";
    $("editStatus").value = txn.status || "pending";

    $("editModal").style.display = "flex";
  }

  function closeEditModal() {
    $("editModal").style.display = "none";
  }

  function saveEdit() {
    const id = $("editId").value;
    if (!id) return;

    const patch = {
      date: $("editDate").value,
      amount: Number($("editAmount").value) || 0,
      category: $("editCategory").value,
      subcategory: $("editSubcategory").value,
      payment_method: $("editPaymentMethod").value,
      merchant: $("editMerchant").value,
      item: $("editItem").value,
      memo: $("editMemo").value,
      tags: $("editTags").value,
      status: $("editStatus").value
    };

    $("btnSaveEdit").disabled = true;
    $("btnSaveEdit").textContent = "保存中...";

    google.script.run
      .withSuccessHandler((res) => {
        $("btnSaveEdit").disabled = false;
        $("btnSaveEdit").textContent = "保存";

        if (res && res.ok) {
          closeEditModal();
          loadHistory();
        } else {
          alert(res?.error?.user_message || "保存に失敗しました");
        }
      })
      .withFailureHandler((e) => {
        $("btnSaveEdit").disabled = false;
        $("btnSaveEdit").textContent = "保存";
        alert("エラー: " + (e?.message || String(e)));
      })
      .updateTransaction(id, patch);
  }

  /* ========== ダッシュボード ========== */

  let analyticsMonthStart = getCurrentMonthStart();
  let categoryChartInstance = null;
  let trendChartInstance = null;

  const CATEGORY_COLORS = [
    "#6366F1", "#EC4899", "#F59E0B", "#10B981", "#3B82F6",
    "#8B5CF6", "#EF4444", "#14B8A6", "#F97316", "#84CC16"
  ];

  function changeAnalyticsMonth(delta) {
    const d = new Date(analyticsMonthStart);
    d.setMonth(d.getMonth() + delta);
    const y = d.getFullYear();
    const m = ("0" + (d.getMonth() + 1)).slice(-2);
    analyticsMonthStart = `${y}-${m}-01`;
    $("analyticsMonth").textContent = `${y}-${m}`;
    loadDashboard();
  }

  function loadDashboard() {
    const cacheKey = `dashboard_${analyticsMonthStart}`;

    // ====== 段階1: キャッシュから即時表示 ======
    const cached = getCache_(cacheKey, true);
    if (cached) {
      renderKpi(cached.kpi, cached.currency);
      renderCategoryChart(cached.byCategory, cached.currency);
      renderTrendChart(cached.trend12m, cached.currency);
    }

    // ローディング（キャッシュがない場合のみ表示）
    if (!cached) {
      $("kpiLoading").style.display = "block";
    }

    // ====== 段階2: サーバーから最新データを取得 ======
    google.script.run
      .withSuccessHandler((res) => {
        $("kpiLoading").style.display = "none";

        if (!res || !res.ok) {
          console.error("Dashboard load failed:", res?.error);
          return;
        }

        const { kpi, byCategory, trend12m, currency } = res.result;

        // キャッシュに保存
        setCache_(cacheKey, { kpi, byCategory, trend12m, currency });

        // ====== 段階3: 最新データで更新 ======
        renderKpi(kpi, currency);
        renderCategoryChart(byCategory, currency);
        renderTrendChart(trend12m, currency);
        loadInsights();
        loadFixedCosts();  // 固定費一覧も読み込み
      })
      .withFailureHandler((e) => {
        $("kpiLoading").style.display = "none";
        console.error("Dashboard error:", e);
      })
      .getDashboard(analyticsMonthStart, {});
  }

  function renderKpi(kpi, currency) {
    const fmt = (n) => currency === "JPY" ? "¥" + n.toLocaleString() : currency + " " + n.toLocaleString();

    $("kpiExpense").textContent = fmt(kpi.expense);
    $("kpiIncome").textContent = fmt(kpi.income);

    const netEl = $("kpiNet");
    netEl.textContent = fmt(kpi.net);
    netEl.className = "kpi-value " + (kpi.net >= 0 ? "kpi-positive" : "kpi-negative");
  }

  function renderCategoryChart(byCategory, currency) {
    const ctx = $("categoryChart").getContext("2d");

    if (categoryChartInstance) {
      categoryChartInstance.destroy();
    }

    if (!byCategory || byCategory.length === 0) {
      $("categoryLegend").innerHTML = "<span class='empty-message'>データがありません</span>";
      return;
    }

    const labels = byCategory.map(c => c.category);
    const data = byCategory.map(c => c.amount);
    const colors = byCategory.map((_, i) => CATEGORY_COLORS[i % CATEGORY_COLORS.length]);

    categoryChartInstance = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: labels,
        datasets: [{ data: data, backgroundColor: colors, borderWidth: 0 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });

    const total = data.reduce((a, b) => a + b, 0);
    const legendHtml = byCategory.map((c, i) => {
      const pct = total > 0 ? Math.round((c.amount / total) * 100) : 0;
      const color = CATEGORY_COLORS[i % CATEGORY_COLORS.length];
      return `
        <div class="legend-item">
          <span class="legend-color" style="background:${color}"></span>
          <span class="legend-label">${c.category}</span>
          <span class="legend-value">${pct}%</span>
        </div>
      `;
    }).join("");
    $("categoryLegend").innerHTML = legendHtml;
  }

  function renderTrendChart(trend12m, currency) {
    const ctx = $("trendChart").getContext("2d");

    if (trendChartInstance) {
      trendChartInstance.destroy();
    }

    if (!trend12m || trend12m.length === 0) {
      return;
    }

    const labels = trend12m.map(t => {
      const parts = t.month.split("-");
      return `${parts[1]}月`;
    });
    const data = trend12m.map(t => t.expense);

    trendChartInstance = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "支出",
          data: data,
          borderColor: "#6366F1",
          backgroundColor: "rgba(99, 102, 241, 0.1)",
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: "#6366F1"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: function(value) {
                return currency === "JPY" ? "¥" + value.toLocaleString() : value.toLocaleString();
              }
            }
          }
        }
      }
    });
  }

  /* ========== インサイト ========== */

  function loadInsights() {
    $("insightsLoading").style.display = "block";

    google.script.run
      .withSuccessHandler((res) => {
        $("insightsLoading").style.display = "none";

        if (!res || !res.ok) {
          console.error("Insights load failed:", res?.error);
          return;
        }

        const { summary, overspendTop3, savingsTop3, fixedCost, meta } = res.result;
        const currency = meta?.currency || "JPY";

        renderMoM(summary, currency);
        renderOverspend(overspendTop3, currency);
        renderSavings(savingsTop3, currency);
        renderFixedCost(fixedCost, currency);
      })
      .withFailureHandler((e) => {
        $("insightsLoading").style.display = "none";
        console.error("Insights error:", e);
      })
      .getInsights(analyticsMonthStart, {});
  }

  function renderMoM(summary, currency) {
    const fmt = (n) => currency === "JPY" ? "¥" + Math.abs(n).toLocaleString() : currency + " " + Math.abs(n).toLocaleString();

    const deltaEl = $("momDelta");
    const delta = summary.delta;
    const sign = delta >= 0 ? "+" : "-";
    deltaEl.textContent = sign + fmt(delta);
    deltaEl.className = "mom-delta " + (delta >= 0 ? "positive" : "negative");

    const pctEl = $("momPct");
    if (summary.delta_pct !== null) {
      const pctSign = summary.delta_pct >= 0 ? "+" : "";
      pctEl.textContent = `（${pctSign}${summary.delta_pct}%）`;
    } else {
      pctEl.textContent = "";
    }

    $("momThis").textContent = fmt(summary.expense);
    $("momPrev").textContent = fmt(summary.prev_expense);
  }

  function renderOverspend(list, currency) {
    const container = $("overspendList");
    const empty = $("overspendEmpty");

    if (!list || list.length === 0) {
      container.innerHTML = "";
      empty.style.display = "block";
      return;
    }

    empty.style.display = "none";
    container.innerHTML = list.map(item => {
      const amt = currency === "JPY" ? "¥" + item.delta.toLocaleString() : currency + " " + item.delta.toLocaleString();

  // 固定費ドーナツグラフのインスタンス
  let fixedCostPieChart = null;

  function renderFixedCost(fixedCost, currency) {
    const fmt = (n) => currency === "JPY" ? "¥" + n.toLocaleString() : currency + " " + n.toLocaleString();

    $("fixedRatio").textContent = fixedCost.this_ratio_pct + "%";
    $("fixedTotal").textContent = fmt(fixedCost.this_total);
    $("expenseTotal").textContent = fmt(fixedCost.expense_total);

    // ドーナツグラフを描画
    renderFixedCostPieChart(fixedCost.pie, fmt);

    const breakdown = fixedCost.breakdown || [];
    if (breakdown.length === 0) {
      const breakdownEl = $("fixedBreakdown");
      if (breakdownEl) breakdownEl.innerHTML = "<span class='empty-message'>固定費データなし</span>";
      return;
    }

    const breakdownEl = $("fixedBreakdown");
    if (breakdownEl) {
      breakdownEl.innerHTML = breakdown.map(item => `
        <div class="fixed-item">
          <span class="fixed-item-cat">${item.category}</span>
          <span class="fixed-item-amt">${fmt(item.amount)}</span>
        </div>
      `).join("");
    }
  }

  function renderFixedCostPieChart(pie, fmt) {
    const canvas = $("fixedCostPieChart");
    if (!canvas) return;

    // pieデータがない場合はスキップ
    if (!pie || !pie.values || pie.values.every(v => v === 0)) {
      return;
    }

    const ctx = canvas.getContext("2d");
    const data = {
      labels: pie.labels || ["固定費", "変動費"],
      datasets: [{
        data: pie.values,
        backgroundColor: ["#6366F1", "#10B981"],
        borderWidth: 0
      }]
    };

    const options = {
      responsive: true,
      maintainAspectRatio: true,
      cutout: "65%",
      plugins: {
        legend: {
          display: true,
          position: "bottom",
          labels: {
            font: { size: 11 },
            padding: 8
          }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const v = context.raw || 0;
              return context.label + ": " + fmt(v);
            }
          }
        }
      }
    };

    if (fixedCostPieChart) {
      fixedCostPieChart.data = data;
      fixedCostPieChart.update();
    } else {
      fixedCostPieChart = new Chart(ctx, {
        type: "doughnut",
        data: data,
        options: options
      });
    }
  }

    const listEl = $(kind === "CATEGORY" ? "masterCategoryList" : "masterPaymentList");

    // 対象のmaster-itemを検索
    const items = listEl.querySelectorAll(".master-item");
    items.forEach(item => {
      const itemName = item.dataset.name;
      if (itemName === oldName) {
        const nameDiv = item.querySelector(".master-item-name");
        const actionsDiv = item.querySelector(".master-item-actions");

        // 入力フィールドに置き換え
        nameDiv.innerHTML = `<input type="text" value="${escapeHtml_(oldName)}" data-old="${escapeHtml_(oldName)}">`;
        const input = nameDiv.querySelector("input");
        input.focus();
        input.select();

        // ボタンを保存/キャンセルに変更
        actionsDiv.innerHTML = `
          <button class="btn-save-rename" onclick="saveRenameMaster('${kind}', this)">保存</button>

    const item = btnEl.closest(".master-item");
    const input = item.querySelector(".master-item-name input");
    const oldName = input.dataset.old;
    const newName = input.value.trim();

    if (!newName) {
      setMasterStatus("名前を入力してください", "error");
      return;
    }

    if (oldName === newName) {
      // 変更なし
      loadMasterData();
      return;
    }

    setMasterStatus("保存中...");

    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.ok) {
          setMasterStatus("保存に失敗しました: " + (res?.error?.message || ""), "error");
          return;

        setMasterStatus("保存しました（取引データも更新済み）", "success");
        loadMasterData();
      })
      .withFailureHandler((e) => {
        setMasterStatus("エラー: " + (e?.message || String(e)), "error");
      })
      .renameMaster(kind, oldName, newName, true);  // propagate=true

  /**
   * 精算確認モーダルを表示
   */
  function showSettlementModal(settlementData) {
    const modal = $("settlementModal");
    if (!modal) return;

    const { card_name, requested_amount, unsettled_items, unsettled_total, difference } = settlementData;

    // カード名
    $("settlementCardName").textContent = card_name + " の精算";
    $("settlementCardNameHidden").value = card_name;

    // 金額
    $("settlementRequestedAmount").textContent = "¥" + requested_amount.toLocaleString();
    $("settlementRecordedTotal").textContent = "¥" + unsettled_total.toLocaleString();
    $("settlementAmountHidden").value = requested_amount;
    $("settlementDateHidden").value = getTodayISO_();

    // 差額
    const diffEl = $("settlementDifference");
    const diffRow = diffEl.closest(".settlement-diff");
    if (Math.abs(difference) < 1) {
      diffEl.textContent = "¥0（ぴったり一致）";
      diffRow.classList.remove("positive", "negative");
      $("settlementDiffAction").style.display = "none";
    } else if (difference > 0) {
      diffEl.textContent = "+¥" + difference.toLocaleString() + "（未記帳分）";
      diffRow.classList.add("positive");
      diffRow.classList.remove("negative");
      $("settlementDiffAction").style.display = "block";
    } else {
      diffEl.textContent = "¥" + difference.toLocaleString() + "（記録が多い）";
      diffRow.classList.add("negative");
      diffRow.classList.remove("positive");
      $("settlementDiffAction").style.display = "none";
    }

    // 明細件数
    $("settlementItemCount").textContent = unsettled_items.length;

    // 明細一覧
    const listEl = $("settlementItemList");
    if (unsettled_items.length === 0) {
      listEl.innerHTML = '<div class="settlement-empty">未精算の明細がありません</div>';
    } else {
      listEl.innerHTML = unsettled_items.map(item => `
        <div class="settlement-item">
          <div class="settlement-item-left">
            <span class="settlement-item-date">${item.date || "日付不明"}</span>
            <span class="settlement-item-merchant">${item.merchant || item.item || "（明細）"}</span>
          </div>
          <span class="settlement-item-amount">¥${item.amount.toLocaleString()}</span>
        </div>
      `).join("");
    }

    modal.style.display = "flex";
  }

  /**
   * 精算確認モーダルを閉じる
   */
  function closeSettlementModal() {
    const modal = $("settlementModal");
    if (modal) modal.style.display = "none";
  }

  /**
   * 精算を確定
   */
  function confirmSettlement() {
    const cardName = $("settlementCardNameHidden").value;
    const settledAmount = Number($("settlementAmountHidden").value) || 0;
    const settledDate = $("settlementDateHidden").value || getTodayISO_();
    const recordDifference = $("recordDifference")?.checked || false;

    const btn = $("btnConfirmSettlement");
    if (btn) {
      btn.disabled = true;
      btn.textContent = "処理中...";
    }

    google.script.run
      .withSuccessHandler((res) => {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "精算を確定";
        }

        if (!res || !res.success) {
          alert("精算処理に失敗しました: " + (res?.message || "エラー"));
          return;
        }

        closeSettlementModal();
        pushChat_("ai", res.message);
        setHomeStatus("精算が完了しました！");

        // 履歴を更新
        clearCache_();
      })
      .withFailureHandler((e) => {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "精算を確定";
        }
        alert("エラー: " + (e?.message || String(e)));
      })
      .processSettlement(cardName, settledAmount, settledDate, {
        recordDifference: recordDifference,
        differenceCategory: "その他"
      });
  }

  /**
   * 結果に精算情報が含まれている場合、精算モーダルを表示
   */
  function checkAndShowSettlement_(res) {
    if (res && res.ok && res.result && res.result.settlement) {
      showSettlementModal(res.result.settlement);
      return true;
    }
    return false;
  }
</script>
