<script>
  const $ = (id) => document.getElementById(id);

  // UIマスタデータ（カテゴリ/支払方法）
  let MASTER = null;

  /* ========== 共通ユーティリティ ========== */

  /**
   * クライアントコンテキスト（二重送信防止用）
   */
  function clientContext_() {
    return {
      client_request_id: generateUUID_(),
      client_time: new Date().toISOString(),
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Tokyo",
      device: "mobile",
      ui_version: "0.9"
    };
  }

  /**
   * UUID生成
   */
  function generateUUID_() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
      const r = Math.random() * 16 | 0;
      const v = c === "x" ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  /**
   * 今日の日付をISO形式で取得
   */
  function getTodayISO_() {
    const d = new Date();
    const y = d.getFullYear();
    const m = ("0" + (d.getMonth() + 1)).slice(-2);
    const day = ("0" + d.getDate()).slice(-2);
    return `${y}-${m}-${day}`;
  }

  /**
   * 画像をリサイズしてdataURLに変換
   */
  function resizeImageToDataUrl_(file, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();

      reader.onload = () => { img.src = reader.result; };
      reader.onerror = reject;

      img.onload = () => {
        const w = img.width;
        const h = img.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        const nw = Math.round(w * scale);
        const nh = Math.round(h * scale);

        const canvas = document.createElement("canvas");
        canvas.width = nw;
        canvas.height = nh;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, nw, nh);

        const out = canvas.toDataURL("image/jpeg", quality);
        resolve(out);
      };
      img.onerror = reject;

      reader.readAsDataURL(file);
    });
  }

  /**
   * selectを文字列配列で構築（[object Object]問題を解消）
   */
  function fillSelect_(selectEl, items, placeholder) {
    if (!selectEl) return;
    selectEl.innerHTML = "";

    const ph = document.createElement("option");
    ph.value = "";
    ph.textContent = placeholder || "選択してください";
    selectEl.appendChild(ph);

    items.forEach(item => {
      // itemがobjectでも安全に文字列を取り出す
      const label = (typeof item === "string") ? item : (item.label || item.name || item.category || item.value || String(item));
      const value = (typeof item === "string") ? item : (item.value || item.id || label);

      if (!label) return;
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label; // ここで必ず文字列
      selectEl.appendChild(opt);
    });
  }

  /* ========== ホームタブ（カメラ/音声/フォーム統合） ========== */

  /**
   * ホームステータス表示
   */
  function setHomeStatus(msg) {
    const el = $("homeStatus");
    if (el) el.textContent = msg;
  }

  /**
   * OCRステータス表示
   */
  function setOcrStatus(msg, type) {
    const el = $("ocrStatus");
    if (el) {
      el.textContent = msg;
      el.className = "hint " + (type || "");
    }
  }

  /**
   * カメラ/写真からのファイル処理 → フォームに反映
   */
  async function handleReceiptFile_(file, source) {
    if (!file) return;

    setOcrStatus("画像を準備しています...", "processing");

    try {
      const dataUrl = await resizeImageToDataUrl_(file, 1280, 0.75);
      setOcrStatus("レシートを解析中...", "processing");

      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.ok) {
            setOcrStatus("解析に失敗しました。手入力してください。", "error");
            return;
          }
          applyDraftToHomeForm_(res.result.draft);
          setOcrStatus("読み取り完了！内容を確認して保存してください", "success");
        })
        .withFailureHandler((err) => {
          setOcrStatus("エラー: " + (err?.message || String(err)), "error");
        })
        .processReceiptV2(dataUrl, clientContext_());

    } catch (e) {
      setOcrStatus("画像処理に失敗しました", "error");
    }
  }

  /**
   * ドラフトをホームフォームに反映
   */
  function applyDraftToHomeForm_(draft) {
    if (!draft) return;

    const dateEl = $("inputDate");
    const amtEl = $("inputAmount");
    const merEl = $("inputMerchant");
    const memoEl = $("inputMemo");
    const catEl = $("inputCategory");
    const payEl = $("inputPayment");

    if (dateEl && draft.date) dateEl.value = draft.date;
    if (amtEl && draft.amount) amtEl.value = draft.amount;
    if (merEl && draft.merchant) merEl.value = draft.merchant;
    if (catEl && draft.category) catEl.value = draft.category;
    if (payEl && draft.payment_method) payEl.value = draft.payment_method;

    // raw_textがあればメモに追加
    if (memoEl && draft.raw_text) {
      memoEl.value = memoEl.value ? memoEl.value + "\n" + draft.raw_text : draft.raw_text;
    }
  }

  /**
   * ホームフォームから保存
   */
  function saveFromHome() {
    const amount = Number($("inputAmount")?.value);
    if (!amount || amount <= 0) {
      setHomeStatus("金額を入力してください");
      return;
    }

    const draft = {
      date: $("inputDate")?.value || getTodayISO_(),
      amount: amount,
      merchant: $("inputMerchant")?.value || "",
      category: $("inputCategory")?.value || "",
      subcategory: "",
      payment_method: $("inputPayment")?.value || "",
      memo: $("inputMemo")?.value || "",
      raw_text: "",
      confidence: 0
    };

    const btn = $("btnSaveHome");
    if (btn) btn.disabled = true;
    setHomeStatus("保存中...");

    google.script.run
      .withSuccessHandler((res) => {
        if (btn) btn.disabled = false;

        if (!res || !res.ok) {
          setHomeStatus("保存失敗: " + (res?.error?.user_message || "エラー"));
          return;
        }

        const t = res.result.transaction;
        setHomeStatus(`保存しました！ (ID: ${t.id})`);

        setTimeout(() => {
          clearHomeForm();
          setHomeStatus("レシート撮影または音声入力で自動入力できます");
        }, 2000);
      })
      .withFailureHandler((e) => {
        if (btn) btn.disabled = false;
        setHomeStatus("エラー: " + (e?.message || String(e)));
      })
      .saveTransactionDraft(draft, clientContext_());
  }

  /**
   * ホームフォームをクリア
   */
  function clearHomeForm() {
    if ($("inputDate")) $("inputDate").value = getTodayISO_();
    if ($("inputAmount")) $("inputAmount").value = "";
    if ($("inputMerchant")) $("inputMerchant").value = "";
    if ($("inputCategory")) $("inputCategory").value = "";
    if ($("inputPayment")) $("inputPayment").value = "";
    if ($("inputMemo")) $("inputMemo").value = "";
    if ($("receiptCam")) $("receiptCam").value = "";
    if ($("receiptPick")) $("receiptPick").value = "";
    setOcrStatus("", "");
    clearVoice_();
  }

  /* ========== 音声入力 ========== */

  let recognition = null;
  let listening = false;

  /**
   * 音声入力のセットアップ
   */
  function setupVoiceInput_() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const btn = $("btnMic");

    if (!SR || !btn) {
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="assistBtn-icon">🎤</span> 音声入力（非対応）';
      }
      return;
    }

    recognition = new SR();
    recognition.lang = "ja-JP";
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = () => {
      listening = true;
      btn.classList.add("listening");
      btn.innerHTML = '<span class="assistBtn-icon">⏺</span> 録音中...';
      $("voiceBox").style.display = "block";
    };

    recognition.onresult = (e) => {
      let text = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        text += e.results[i][0].transcript;
      }
      $("voiceText").value = text.trim();
    };

    recognition.onend = () => {
      listening = false;
      btn.classList.remove("listening");
      btn.innerHTML = '<span class="assistBtn-icon">🎤</span> 音声で入力';
    };

    recognition.onerror = (e) => {
      listening = false;
      btn.classList.remove("listening");
      btn.innerHTML = '<span class="assistBtn-icon">🎤</span> 音声で入力';
      if (e.error === "not-allowed") {
        setOcrStatus("マイク権限が必要です。ブラウザ設定をご確認ください。", "error");
      } else {
        setOcrStatus("音声入力に失敗しました", "error");
      }
    };

    btn.addEventListener("click", () => {
      if (listening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });
  }

  /**
   * 音声テキストから金額/店名を抽出
   */
  function parseSpeechToDraft_(text) {
    const t = (text || "").trim();
    if (!t) return {};

    // 金額: "620円" "620 えん" "1,500円" など
    const m = t.match(/([\d,]+)\s*(円|えん)/);
    const amount = m ? Number(m[1].replace(/,/g, "")) : 0;

    // 店名: 金額の前の部分をざっくり店名/内容扱い
    let merchant = "";
    if (m) {
      merchant = t.slice(0, m.index).trim();
    } else {
      merchant = t;
    }

    return { merchant, amount };
  }

  /**
   * 音声認識結果をフォームに反映
   */
  function applyVoiceToForm_() {
    const t = $("voiceText")?.value?.trim();
    if (!t) return;

    // 金額/店名を抽出してフォームに反映
    const d = parseSpeechToDraft_(t);

    if (d.merchant && $("inputMerchant")) {
      $("inputMerchant").value = d.merchant;
    }
    if (d.amount && $("inputAmount")) {
      $("inputAmount").value = d.amount;
    }

    // rawとしてメモにも残す
    const memoEl = $("inputMemo");
    if (memoEl) {
      memoEl.value = memoEl.value ? memoEl.value + " / " + t : t;
    }

    setOcrStatus("音声からフォームに反映しました", "success");
  }

  /**
   * 音声認識結果をクリア
   */
  function clearVoice_() {
    if ($("voiceText")) $("voiceText").value = "";
    if ($("voiceBox")) $("voiceBox").style.display = "none";
  }

  /* ========== 入力タブ（手入力専用） ========== */

  /**
   * フォームステータス表示
   */
  function setFormStatus(msg) {
    const el = $("formStatus");
    if (el) el.textContent = msg;
  }

  /**
   * 入力タブから保存
   */
  function saveDraft() {
    const amount = Number($("formAmount")?.value);
    if (!amount || amount <= 0) {
      setFormStatus("金額を入力してください");
      return;
    }

    const draft = {
      date: $("formDate")?.value || getTodayISO_(),
      amount: amount,
      merchant: $("formMerchant")?.value || "",
      category: $("formCategory")?.value || "",
      subcategory: "",
      payment_method: $("formPayment")?.value || "",
      memo: $("formMemo")?.value || "",
      raw_text: "",
      confidence: 0
    };

    const btn = $("btnSaveDraft");
    if (btn) btn.disabled = true;
    setFormStatus("保存中...");

    google.script.run
      .withSuccessHandler((res) => {
        if (btn) btn.disabled = false;

        if (!res || !res.ok) {
          setFormStatus("保存失敗: " + (res?.error?.user_message || "エラー"));
          return;
        }

        const t = res.result.transaction;
        setFormStatus(`保存しました (ID: ${t.id})`);

        setTimeout(() => {
          clearForm();
        }, 1500);
      })
      .withFailureHandler((e) => {
        if (btn) btn.disabled = false;
        setFormStatus("エラー: " + (e?.message || String(e)));
      })
      .saveTransactionDraft(draft, clientContext_());
  }

  /**
   * 入力タブフォームをクリア
   */
  function clearForm() {
    if ($("formDate")) $("formDate").value = getTodayISO_();
    if ($("formAmount")) $("formAmount").value = "";
    if ($("formMerchant")) $("formMerchant").value = "";
    if ($("formCategory")) $("formCategory").value = "";
    if ($("formPayment")) $("formPayment").value = "";
    if ($("formMemo")) $("formMemo").value = "";
    setFormStatus("入力してください");
  }

  /* ========== タブ・履歴・編集 ========== */

  let currentMonthStart = getCurrentMonthStart();

  function getCurrentMonthStart() {
    const now = new Date();
    const y = now.getFullYear();
    const m = ("0" + (now.getMonth() + 1)).slice(-2);
    return `${y}-${m}-01`;
  }

  function switchTab(tabName) {
    document.querySelectorAll(".tab").forEach(t => {
      t.classList.toggle("active", t.dataset.tab === tabName);
    });

    document.querySelectorAll(".tab-content").forEach(c => {
      c.classList.toggle("active", c.id === `tab-${tabName}`);
    });

    if (tabName === "history") {
      loadHistory();
    }
    if (tabName === "analytics") {
      loadDashboard();
    }
  }

  function changeMonth(delta) {
    const d = new Date(currentMonthStart);
    d.setMonth(d.getMonth() + delta);
    const y = d.getFullYear();
    const m = ("0" + (d.getMonth() + 1)).slice(-2);
    currentMonthStart = `${y}-${m}-01`;
    $("currentMonth").textContent = `${y}-${m}`;
    loadHistory();
  }

  function loadHistory() {
    const statusFilter = $("statusFilter")?.value || "";
    const filters = {};
    if (statusFilter) filters.status = statusFilter;
    filters.includeUndated = true;

    $("historyLoading").style.display = "block";
    $("historyList").innerHTML = "";
    $("historyEmpty").style.display = "none";
    $("undatedSection").style.display = "none";

    google.script.run
      .withSuccessHandler((res) => {
        $("historyLoading").style.display = "none";

        if (!res || !res.ok) {
          $("historyEmpty").style.display = "block";
          $("historyEmpty").textContent = res?.error?.user_message || "読み込みに失敗しました";
          return;
        }

        const { rows, undatedRows } = res.result;

        if (undatedRows && undatedRows.length > 0) {
          $("undatedSection").style.display = "block";
          $("undatedList").innerHTML = undatedRows.map(renderHistoryCard).join("");
        }

        if (rows && rows.length > 0) {
          $("historyList").innerHTML = rows.map(renderHistoryCard).join("");
        } else if (!undatedRows || undatedRows.length === 0) {
          $("historyEmpty").style.display = "block";
        }
      })
      .withFailureHandler((e) => {
        $("historyLoading").style.display = "none";
        $("historyEmpty").style.display = "block";
        $("historyEmpty").textContent = "読み込みエラー: " + (e?.message || String(e));
      })
      .listTransactions(currentMonthStart, filters);
  }

  function renderHistoryCard(txn) {
    const dateDisplay = txn.date || "日付未確定";
    const statusLabel = {
      confirmed: "確定",
      pending: "未確定",
      needs_review: "要確認"
    }[txn.status] || txn.status;

    return `
      <div class="history-card" onclick='openEditModal(${JSON.stringify(txn).replace(/'/g, "&#39;")})'>
        <div class="history-card-row1">
          <span class="history-date">${dateDisplay}</span>
          <span class="badge badge-${txn.status}">${statusLabel}</span>
        </div>
        <div class="history-card-row2">
          ${txn.merchant || txn.item || "(詳細なし)"}
        </div>
        <div class="history-card-row3">
          ${txn.category}${txn.subcategory ? " / " + txn.subcategory : ""}
        </div>
        <div class="history-amount">¥${txn.amount.toLocaleString()}</div>
      </div>
    `;
  }

  function openEditModal(txn) {
    $("editId").value = txn.id;
    $("editDate").value = txn.date || "";
    $("editAmount").value = txn.amount || "";
    $("editCategory").value = txn.category || "";
    $("editSubcategory").value = txn.subcategory || "";
    $("editPaymentMethod").value = txn.payment_method || "";
    $("editMerchant").value = txn.merchant || "";
    $("editItem").value = txn.item || "";
    $("editMemo").value = txn.memo || "";
    $("editTags").value = txn.tags || "";
    $("editStatus").value = txn.status || "pending";

    $("editModal").style.display = "flex";
  }

  function closeEditModal() {
    $("editModal").style.display = "none";
  }

  function saveEdit() {
    const id = $("editId").value;
    if (!id) return;

    const patch = {
      date: $("editDate").value,
      amount: Number($("editAmount").value) || 0,
      category: $("editCategory").value,
      subcategory: $("editSubcategory").value,
      payment_method: $("editPaymentMethod").value,
      merchant: $("editMerchant").value,
      item: $("editItem").value,
      memo: $("editMemo").value,
      tags: $("editTags").value,
      status: $("editStatus").value
    };

    $("btnSaveEdit").disabled = true;
    $("btnSaveEdit").textContent = "保存中...";

    google.script.run
      .withSuccessHandler((res) => {
        $("btnSaveEdit").disabled = false;
        $("btnSaveEdit").textContent = "保存";

        if (res && res.ok) {
          closeEditModal();
          loadHistory();
        } else {
          alert(res?.error?.user_message || "保存に失敗しました");
        }
      })
      .withFailureHandler((e) => {
        $("btnSaveEdit").disabled = false;
        $("btnSaveEdit").textContent = "保存";
        alert("エラー: " + (e?.message || String(e)));
      })
      .updateTransaction(id, patch);
  }

  /* ========== ダッシュボード ========== */

  let analyticsMonthStart = getCurrentMonthStart();
  let categoryChartInstance = null;
  let trendChartInstance = null;

  const CATEGORY_COLORS = [
    "#6366F1", "#EC4899", "#F59E0B", "#10B981", "#3B82F6",
    "#8B5CF6", "#EF4444", "#14B8A6", "#F97316", "#84CC16"
  ];

  function changeAnalyticsMonth(delta) {
    const d = new Date(analyticsMonthStart);
    d.setMonth(d.getMonth() + delta);
    const y = d.getFullYear();
    const m = ("0" + (d.getMonth() + 1)).slice(-2);
    analyticsMonthStart = `${y}-${m}-01`;
    $("analyticsMonth").textContent = `${y}-${m}`;
    loadDashboard();
  }

  function loadDashboard() {
    $("kpiLoading").style.display = "block";

    google.script.run
      .withSuccessHandler((res) => {
        $("kpiLoading").style.display = "none";

        if (!res || !res.ok) {
          console.error("Dashboard load failed:", res?.error);
          return;
        }

        const { kpi, byCategory, trend12m, currency } = res.result;

        renderKpi(kpi, currency);
        renderCategoryChart(byCategory, currency);
        renderTrendChart(trend12m, currency);
        loadInsights();
      })
      .withFailureHandler((e) => {
        $("kpiLoading").style.display = "none";
        console.error("Dashboard error:", e);
      })
      .getDashboard(analyticsMonthStart, {});
  }

  function renderKpi(kpi, currency) {
    const fmt = (n) => currency === "JPY" ? "¥" + n.toLocaleString() : currency + " " + n.toLocaleString();

    $("kpiExpense").textContent = fmt(kpi.expense);
    $("kpiIncome").textContent = fmt(kpi.income);

    const netEl = $("kpiNet");
    netEl.textContent = fmt(kpi.net);
    netEl.className = "kpi-value " + (kpi.net >= 0 ? "kpi-positive" : "kpi-negative");
  }

  function renderCategoryChart(byCategory, currency) {
    const ctx = $("categoryChart").getContext("2d");

    if (categoryChartInstance) {
      categoryChartInstance.destroy();
    }

    if (!byCategory || byCategory.length === 0) {
      $("categoryLegend").innerHTML = "<span class='empty-message'>データがありません</span>";
      return;
    }

    const labels = byCategory.map(c => c.category);
    const data = byCategory.map(c => c.amount);
    const colors = byCategory.map((_, i) => CATEGORY_COLORS[i % CATEGORY_COLORS.length]);

    categoryChartInstance = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: labels,
        datasets: [{ data: data, backgroundColor: colors, borderWidth: 0 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });

    const total = data.reduce((a, b) => a + b, 0);
    const legendHtml = byCategory.map((c, i) => {
      const pct = total > 0 ? Math.round((c.amount / total) * 100) : 0;
      const color = CATEGORY_COLORS[i % CATEGORY_COLORS.length];
      return `
        <div class="legend-item">
          <span class="legend-color" style="background:${color}"></span>
          <span class="legend-label">${c.category}</span>
          <span class="legend-value">${pct}%</span>
        </div>
      `;
    }).join("");
    $("categoryLegend").innerHTML = legendHtml;
  }

  function renderTrendChart(trend12m, currency) {
    const ctx = $("trendChart").getContext("2d");

    if (trendChartInstance) {
      trendChartInstance.destroy();
    }

    if (!trend12m || trend12m.length === 0) {
      return;
    }

    const labels = trend12m.map(t => {
      const parts = t.month.split("-");
      return `${parts[1]}月`;
    });
    const data = trend12m.map(t => t.expense);

    trendChartInstance = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "支出",
          data: data,
          borderColor: "#6366F1",
          backgroundColor: "rgba(99, 102, 241, 0.1)",
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: "#6366F1"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: function(value) {
                return currency === "JPY" ? "¥" + value.toLocaleString() : value.toLocaleString();
              }
            }
          }
        }
      }
    });
  }

  /* ========== インサイト ========== */

  function loadInsights() {
    $("insightsLoading").style.display = "block";

    google.script.run
      .withSuccessHandler((res) => {
        $("insightsLoading").style.display = "none";

        if (!res || !res.ok) {
          console.error("Insights load failed:", res?.error);
          return;
        }

        const { summary, overspendTop3, savingsTop3, fixedCost, meta } = res.result;
        const currency = meta?.currency || "JPY";

        renderMoM(summary, currency);
        renderOverspend(overspendTop3, currency);
        renderSavings(savingsTop3, currency);
        renderFixedCost(fixedCost, currency);
      })
      .withFailureHandler((e) => {
        $("insightsLoading").style.display = "none";
        console.error("Insights error:", e);
      })
      .getInsights(analyticsMonthStart, {});
  }

  function renderMoM(summary, currency) {
    const fmt = (n) => currency === "JPY" ? "¥" + Math.abs(n).toLocaleString() : currency + " " + Math.abs(n).toLocaleString();

    const deltaEl = $("momDelta");
    const delta = summary.delta;
    const sign = delta >= 0 ? "+" : "-";
    deltaEl.textContent = sign + fmt(delta);
    deltaEl.className = "mom-delta " + (delta >= 0 ? "positive" : "negative");

    const pctEl = $("momPct");
    if (summary.delta_pct !== null) {
      const pctSign = summary.delta_pct >= 0 ? "+" : "";
      pctEl.textContent = `（${pctSign}${summary.delta_pct}%）`;
    } else {
      pctEl.textContent = "";
    }

    $("momThis").textContent = fmt(summary.expense);
    $("momPrev").textContent = fmt(summary.prev_expense);
  }

  function renderOverspend(list, currency) {
    const container = $("overspendList");
    const empty = $("overspendEmpty");

    if (!list || list.length === 0) {
      container.innerHTML = "";
      empty.style.display = "block";
      return;
    }

    empty.style.display = "none";
    container.innerHTML = list.map(item => {
      const amt = currency === "JPY" ? "¥" + item.delta.toLocaleString() : currency + " " + item.delta.toLocaleString();
      const pct = item.delta_pct !== null ? `(+${item.delta_pct}%)` : "";
      return `
        <div class="insight-item">
          <span class="insight-cat">${item.category}</span>
          <span>
            <span class="insight-delta overspend">+${amt}</span>
            <span class="insight-pct">${pct}</span>
          </span>
        </div>
      `;
    }).join("");
  }

  function renderSavings(list, currency) {
    const container = $("savingsList");
    const empty = $("savingsEmpty");

    if (!list || list.length === 0) {
      container.innerHTML = "";
      empty.style.display = "block";
      return;
    }

    empty.style.display = "none";
    container.innerHTML = list.map(item => {
      const amt = currency === "JPY" ? "¥" + Math.abs(item.delta).toLocaleString() : currency + " " + Math.abs(item.delta).toLocaleString();
      const pct = item.delta_pct !== null ? `(${item.delta_pct}%)` : "";
      return `
        <div class="insight-item">
          <span class="insight-cat">${item.category}</span>
          <span>
            <span class="insight-delta savings">-${amt}</span>
            <span class="insight-pct">${pct}</span>
          </span>
        </div>
      `;
    }).join("");
  }

  function renderFixedCost(fixedCost, currency) {
    const fmt = (n) => currency === "JPY" ? "¥" + n.toLocaleString() : currency + " " + n.toLocaleString();

    $("fixedRatio").textContent = fixedCost.this_ratio_pct + "%";
    $("fixedTotal").textContent = fmt(fixedCost.this_total);

    const breakdown = fixedCost.breakdown || [];
    if (breakdown.length === 0) {
      $("fixedBreakdown").innerHTML = "<span class='empty-message'>固定費データなし</span>";
      return;
    }

    $("fixedBreakdown").innerHTML = breakdown.map(item => `
      <div class="fixed-item">
        <span class="fixed-item-cat">${item.category}</span>
        <span class="fixed-item-amt">${fmt(item.amount)}</span>
      </div>
    `).join("");
  }

  /* ========== 初期化 ========== */

  document.addEventListener("DOMContentLoaded", () => {
    const d = new Date(currentMonthStart);
    const ym = `${d.getFullYear()}-${("0" + (d.getMonth() + 1)).slice(-2)}`;
    if ($("currentMonth")) $("currentMonth").textContent = ym;
    if ($("analyticsMonth")) $("analyticsMonth").textContent = ym;

    // ホームフォーム日付初期化
    if ($("inputDate")) $("inputDate").value = getTodayISO_();
    if ($("formDate")) $("formDate").value = getTodayISO_();

    // カメラ/写真イベント
    const cam = $("receiptCam");
    const pick = $("receiptPick");
    if (cam) cam.addEventListener("change", () => handleReceiptFile_(cam.files[0], "camera"));
    if (pick) pick.addEventListener("change", () => handleReceiptFile_(pick.files[0], "picker"));

    // 音声入力セットアップ
    setupVoiceInput_();

    // マスタデータ読み込み（カテゴリ/支払方法）
    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.ok) {
          console.error("Failed to load UI master data:", res?.error);
          return;
        }
        MASTER = res.result;

        // ホームタブのselect
        fillSelect_($("inputCategory"), MASTER.categories, "カテゴリを選択");
        fillSelect_($("inputPayment"), MASTER.paymentMethods, "支払方法を選択");

        // 入力タブのselect
        fillSelect_($("formCategory"), MASTER.categories, "カテゴリを選択");
        fillSelect_($("formPayment"), MASTER.paymentMethods, "支払方法を選択");
      })
      .withFailureHandler((e) => {
        console.error("Failed to load UI master data:", e);
      })
      .getUiMasterData();
  });
</script>
