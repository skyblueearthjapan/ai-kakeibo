<style>
  :root {
    --bg: #F8FAFC;
    --text: #111827;
    --muted: #6B7280;
    --card: #FFFFFF;

    --blue: #DCEBFF;
    --pink: #FFE3EE;
    --mint: #DFF7EE;
    --lav: #EEE6FF;
    --yellow: #FFF6D8;

    --radius: 16px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    line-height: 1.5;
  }

  .top {
    padding: 16px 16px 10px;
  }

  .title {
    font-size: 20px;
    font-weight: 800;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .wrap {
    padding: 0 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
    border: 1px solid rgba(17, 24, 39, 0.06);
  }

  .pastel-blue {
    background: linear-gradient(0deg, #fff, var(--blue));
  }

  .pastel-mint {
    background: linear-gradient(0deg, #fff, var(--mint));
  }

  .pastel-lav {
    background: linear-gradient(0deg, #fff, var(--lav));
  }

  .pastel-pink {
    background: linear-gradient(0deg, #fff, var(--pink));
  }

  h3 {
    margin: 0 0 10px;
    font-size: 16px;
  }

  textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    border-radius: 12px;
    border: 1px solid rgba(17, 24, 39, 0.10);
    padding: 12px;
    font-size: 16px;
    outline: none;
    background: #fff;
  }

  input[type="file"] {
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: 1px dashed rgba(17, 24, 39, 0.20);
    background: #fff;
  }

  .hint {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }

  .btn {
    width: 100%;
    margin-top: 12px;
    height: 46px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .primary {
    background: #111827;
    color: #fff;
  }

  .primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .primary:active:not(:disabled) {
    opacity: 0.8;
  }

  .status {
    margin: 0;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.4;
    word-break: break-word;
  }

  /* ========== Phase 3: タブ・履歴・モーダル ========== */

  /* タブナビゲーション */
  .tabs {
    display: flex;
    padding: 0 16px;
    gap: 8px;
    margin-bottom: 8px;
  }

  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 12px;
    background: rgba(17, 24, 39, 0.06);
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }

  .tab.active {
    background: #111827;
    color: #fff;
  }

  /* タブコンテンツ */
  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: flex;
  }

  /* パステルイエロー */
  .pastel-yellow {
    background: linear-gradient(0deg, #fff, var(--yellow));
  }

  /* 履歴コントロール */
  .history-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .month-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }

  .btn-small {
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    background: #111827;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-small:active {
    opacity: 0.8;
  }

  select {
    padding: 8px 12px;
    border: 1px solid rgba(17, 24, 39, 0.10);
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
  }

  /* 履歴リスト */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-card {
    padding: 12px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid rgba(17, 24, 39, 0.08);
    cursor: pointer;
  }

  .history-card:active {
    background: #F8FAFC;
  }

  .history-card-row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .history-date {
    font-size: 13px;
    color: var(--muted);
  }

  .history-card-row2 {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 2px;
  }

  .history-card-row3 {
    font-size: 13px;
    color: var(--muted);
  }

  .history-amount {
    font-weight: 700;
    font-size: 16px;
    text-align: right;
  }

  /* ステータスバッジ */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-confirmed {
    background: var(--mint);
    color: #047857;
  }

  .badge-pending {
    background: var(--yellow);
    color: #92400E;
  }

  .badge-needs_review {
    background: var(--pink);
    color: #BE185D;
  }

  /* ローディング・空メッセージ */
  .loading, .empty-message {
    text-align: center;
    color: var(--muted);
    padding: 20px;
    font-size: 14px;
  }

  /* モーダル */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-content {
    background: #fff;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    border-radius: 20px 20px 0 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid rgba(17, 24, 39, 0.08);
  }

  .modal-header h3 {
    margin: 0;
  }

  .modal-close {
    border: none;
    background: none;
    font-size: 24px;
    color: var(--muted);
    cursor: pointer;
    padding: 0 8px;
  }

  .modal-body {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-body label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 12px;
  }

  .modal-body label:first-child {
    margin-top: 0;
  }

  .modal-body input,
  .modal-body select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid rgba(17, 24, 39, 0.10);
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
  }

  .modal-footer {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid rgba(17, 24, 39, 0.08);
  }

  .modal-footer .btn {
    margin-top: 0;
    flex: 1;
  }

  .secondary {
    background: rgba(17, 24, 39, 0.08);
    color: var(--text);
  }

  .secondary:active {
    opacity: 0.8;
  }

  /* ========== Phase 4: ダッシュボード ========== */

  /* KPI表示 */
  .kpi-row {
    display: flex;
    gap: 12px;
    justify-content: space-between;
  }

  .kpi-item {
    flex: 1;
    text-align: center;
    padding: 8px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 12px;
  }

  .kpi-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .kpi-value {
    font-size: 18px;
    font-weight: 700;
  }

  .kpi-expense {
    color: #DC2626;
  }

  .kpi-income {
    color: #059669;
  }

  .kpi-positive {
    color: #059669;
  }

  .kpi-negative {
    color: #DC2626;
  }

  /* グラフコンテナ */
  .chart-container {
    position: relative;
    width: 100%;
    height: 200px;
    margin-bottom: 12px;
  }

  /* カテゴリ凡例 */
  .category-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .legend-color {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }

  .legend-label {
    color: var(--muted);
  }

  .legend-value {
    font-weight: 600;
  }

  /* ========== Phase 5: インサイト ========== */

  /* 前月比セクション */
  .mom-section {
    text-align: center;
  }

  .mom-main {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .mom-delta {
    font-size: 24px;
    font-weight: 700;
  }

  .mom-delta.positive {
    color: #DC2626;
  }

  .mom-delta.negative {
    color: #059669;
  }

  .mom-pct {
    font-size: 14px;
    color: var(--muted);
  }

  .mom-detail {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
  }

  /* インサイトリスト */
  .insight-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .insight-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 8px;
  }

  .insight-cat {
    font-weight: 600;
  }

  .insight-delta {
    font-size: 14px;
    font-weight: 600;
  }

  .insight-delta.overspend {
    color: #DC2626;
  }

  .insight-delta.savings {
    color: #059669;
  }

  .insight-pct {
    font-size: 12px;
    color: var(--muted);
    margin-left: 4px;
  }

  /* 固定費セクション */
  .fixed-cost-section {
    text-align: center;
  }

  .fixed-ratio {
    margin-bottom: 12px;
  }

  .fixed-ratio-value {
    font-size: 28px;
    font-weight: 700;
    color: #6366F1;
  }

  .fixed-ratio-label {
    font-size: 13px;
    color: var(--muted);
  }

  .fixed-breakdown {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .fixed-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 12px;
    font-size: 12px;
  }

  .fixed-item-cat {
    color: var(--muted);
  }

  .fixed-item-amt {
    font-weight: 600;
  }

  /* pastel-pink, pastel-coral追加 */
  .pastel-pink {
    background: linear-gradient(135deg, #FECDD3 0%, #FEE2E2 100%);
  }

  .pastel-coral {
    background: linear-gradient(135deg, #FED7AA 0%, #FFEDD5 100%);
  }
</style>
