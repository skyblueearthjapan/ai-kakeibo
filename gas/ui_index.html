<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <!-- viewport（iPhone notch / フルスクリーン対応） -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>AI家計簿</title>

  <!-- ===== iOS PWA設定 ===== -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI家計簿" />

  <!-- iOS ホーム画面アイコン（ロボット） -->
  <link rel="apple-touch-icon" sizes="180x180"
        href="https://drive.google.com/uc?export=view&id=1RGRZTJyM8KScZ3ID8O6EIH8svJ493Ipr" />

  <!-- favicon（PC / Android用） -->
  <link rel="icon" type="image/png"
        href="https://drive.google.com/uc?export=view&id=1RGRZTJyM8KScZ3ID8O6EIH8svJ493Ipr" />

  <!-- Android / Chrome向け -->
  <meta name="theme-color" content="#ffffff" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <?!= include('ui_style'); ?>
</head>
<body>
  <header class="top">
    <div class="headerRow">
      <div>
        <div class="title">AI家計簿</div>
        <div class="subtitle">話しかけて入力</div>
      </div>
      <span id="aiBadge" class="aiBadge" title="AI状態">AI:--</span>
    </div>
  </header>

  <!-- タブナビゲーション（入力タブ削除） -->
  <nav class="tabs">
    <button class="tab active" data-tab="home" onclick="switchTab('home')">ホーム</button>
    <button class="tab" data-tab="history" onclick="switchTab('history')">履歴</button>
    <button class="tab" data-tab="analytics" onclick="switchTab('analytics')">分析</button>
  </nav>

  <!-- ホームタブ：音声ファースト -->
  <main id="tab-home" class="wrap tab-content active">

    <!-- ===== AI受付（音声ファースト） ===== -->
    <section class="card pastel-mint" id="aiChatCard">
      <div class="cardHeader">
        <h3>AI受付</h3>
        <button class="tinyBtn" type="button" onclick="clearChat_()">クリア</button>
      </div>

      <!-- 音声ボタン（最上部・目立つ） -->
      <div class="voiceMain">
        <button class="voiceBtn" id="btnMic" type="button">
          <span class="voiceIcon">🎤</span>
          <span class="voiceLabel">話して入力</span>
        </button>
      </div>

      <!-- チャット欄 -->
      <div class="chatBox" id="chatBox"></div>

      <!-- キーボード入力（控えめ） -->
      <div class="chatRow">
        <textarea id="chatInput" rows="2" placeholder="音声入力の内容を確認して『送信』（手入力もOK）"></textarea>
        <button class="assistBtn secondary chatSendBtn" type="button" onclick="sendChat_()">送信</button>
      </div>

      <!-- 手入力ボタン -->
      <div class="row actions" style="margin-top:12px;">
        <button class="assistBtn secondary" type="button" onclick="toggleManual_()">手入力でフォームを開く</button>
      </div>
    </section>

    <!-- ===== AIプレビュー ===== -->
    <section class="card pastel-purple" id="aiPreviewCard" style="display:none;">
      <h3>AIの提案</h3>
      <div id="aiPreviewBody" class="previewBody"></div>
      <div class="row actions">
        <button class="assistBtn primary" type="button" onclick="acceptAiDraft_()">この内容でOK</button>
        <button class="assistBtn secondary" type="button" onclick="retryAi_()">やり直す</button>
      </div>
      <div class="hint" id="aiPreviewHint"></div>
    </section>

    <!-- 取引フォーム（初期非表示） -->
    <section id="txnFormWrap" class="card pastel-lav" style="display:none;">
      <h3>取引を入力</h3>
      <div class="form-group">
        <label for="inputDate">日付</label>
        <input type="date" id="inputDate" class="form-input">
      </div>
      <div class="form-group">
        <label for="inputAmount">金額</label>
        <input type="number" id="inputAmount" class="form-input" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label for="inputMerchant">店名・内容</label>
        <input type="text" id="inputMerchant" class="form-input" placeholder="店名や支払先">
      </div>
      <div class="form-group">
        <label for="inputCategory">カテゴリ</label>
        <select id="inputCategory" class="form-input">
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="form-group">
        <label for="inputPayment">支払方法</label>
        <select id="inputPayment" class="form-input">
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="form-group">
        <label for="inputMemo">メモ</label>
        <input type="text" id="inputMemo" class="form-input" placeholder="任意">
      </div>
      <button id="btnSaveHome" class="btn primary" onclick="saveFromHome()">確定して保存</button>
      <button class="btn secondary" onclick="clearHomeForm()">クリア</button>
    </section>

    <!-- 結果表示 -->
    <section class="card pastel-blue">
      <h3>結果</h3>
      <pre id="homeStatus" class="status">音声で話しかけると自動入力できます</pre>
    </section>
  </main>

  <!-- 履歴タブ -->
  <main id="tab-history" class="wrap tab-content">
    <!-- 月選択・フィルタ -->
    <section class="card pastel-yellow">
      <div class="history-controls">
        <div class="month-selector">
          <button class="btn-small" onclick="changeMonth(-1)">&lt;</button>
          <span id="currentMonth">2026-01</span>
          <button class="btn-small" onclick="changeMonth(1)">&gt;</button>
        </div>
        <select id="statusFilter" onchange="loadHistory()">
          <option value="">すべて</option>
          <option value="pending">未確定</option>
          <option value="needs_review">要確認</option>
          <option value="confirmed">確定済み</option>
        </select>
        <button class="btn-small" onclick="loadHistory()">更新</button>
      </div>
    </section>

    <!-- 未確定（date空）セクション -->
    <section id="undatedSection" class="card pastel-pink" style="display:none;">
      <h3>日付未確定</h3>
      <div id="undatedList" class="history-list"></div>
    </section>

    <!-- 履歴一覧 -->
    <section class="card">
      <h3 id="historyTitle">取引一覧</h3>
      <div id="historyLoading" class="loading" style="display:none;">読み込み中...</div>
      <div id="historyList" class="history-list"></div>
      <div id="historyEmpty" class="empty-message" style="display:none;">該当する取引がありません</div>
    </section>
  </main>

  <!-- 分析タブ -->
  <main id="tab-analytics" class="wrap tab-content">
    <!-- 月選択 -->
    <section class="card pastel-yellow">
      <div class="history-controls">
        <div class="month-selector">
          <button class="btn-small" onclick="changeAnalyticsMonth(-1)">&lt;</button>
          <span id="analyticsMonth">2026-01</span>
          <button class="btn-small" onclick="changeAnalyticsMonth(1)">&gt;</button>
        </div>
        <button class="btn-small" onclick="loadDashboard()">更新</button>
      </div>
    </section>

    <!-- KPIカード -->
    <section class="card pastel-mint">
      <h3>今月のサマリー</h3>
      <div id="kpiLoading" class="loading" style="display:none;">読み込み中...</div>
      <div id="kpiSection" class="kpi-row">
        <div class="kpi-item">
          <div class="kpi-label">支出</div>
          <div id="kpiExpense" class="kpi-value kpi-expense">-</div>
        </div>
        <div class="kpi-item">
          <div class="kpi-label">収入</div>
          <div id="kpiIncome" class="kpi-value kpi-income">-</div>
        </div>
        <div class="kpi-item">
          <div class="kpi-label">収支</div>
          <div id="kpiNet" class="kpi-value">-</div>
        </div>
      </div>
    </section>

    <!-- カテゴリ別内訳 -->
    <section class="card pastel-lav">
      <h3>カテゴリ別支出</h3>
      <div id="categoryChartContainer" class="chart-container">
        <canvas id="categoryChart"></canvas>
      </div>
      <div id="categoryLegend" class="category-legend"></div>
    </section>

    <!-- 12ヶ月トレンド -->
    <section class="card pastel-blue">
      <h3>12ヶ月推移</h3>
      <div id="trendChartContainer" class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </section>

    <!-- Phase 5: インサイト -->
    <!-- 前月比カード -->
    <section class="card pastel-pink">
      <h3>前月比</h3>
      <div id="insightsLoading" class="loading" style="display:none;">読み込み中...</div>
      <div id="momSection" class="mom-section">
        <div class="mom-main">
          <span id="momDelta" class="mom-delta">-</span>
          <span id="momPct" class="mom-pct"></span>
        </div>
        <div class="mom-detail">
          <span>今月: <span id="momThis">-</span></span>
          <span>前月: <span id="momPrev">-</span></span>
        </div>
      </div>
    </section>

    <!-- 使いすぎTOP3 -->
    <section class="card pastel-coral">
      <h3>使いすぎカテゴリ TOP3</h3>
      <div id="overspendList" class="insight-list"></div>
      <div id="overspendEmpty" class="empty-message" style="display:none;">該当なし</div>
    </section>

    <!-- 節約TOP3 -->
    <section class="card pastel-mint">
      <h3>節約成功カテゴリ TOP3</h3>
      <div id="savingsList" class="insight-list"></div>
      <div id="savingsEmpty" class="empty-message" style="display:none;">該当なし</div>
    </section>

    <!-- 固定費比率 -->
    <section class="card pastel-yellow">
      <h3>固定費比率</h3>
      <div id="fixedCostSection" class="fixed-cost-section">
        <div class="fixed-ratio">
          <span id="fixedRatio" class="fixed-ratio-value">-</span>
          <span class="fixed-ratio-label">（<span id="fixedTotal">-</span>）</span>
        </div>
        <div id="fixedBreakdown" class="fixed-breakdown"></div>
      </div>
    </section>
  </main>

  <!-- 編集モーダル -->
  <div id="editModal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>取引を編集</h3>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">

        <label>日付</label>
        <input type="date" id="editDate">

        <label>金額</label>
        <input type="number" id="editAmount" min="0">

        <label>カテゴリ</label>
        <input type="text" id="editCategory" placeholder="例：食費">

        <label>小分類</label>
        <input type="text" id="editSubcategory" placeholder="例：カフェ">

        <label>支払方法</label>
        <input type="text" id="editPaymentMethod" placeholder="例：現金">

        <label>店名/支払先</label>
        <input type="text" id="editMerchant" placeholder="例：スターバックス">

        <label>品目</label>
        <input type="text" id="editItem" placeholder="例：ラテ">

        <label>メモ</label>
        <input type="text" id="editMemo">

        <label>タグ</label>
        <input type="text" id="editTags" placeholder="カンマ区切り">

        <label>ステータス</label>
        <select id="editStatus">
          <option value="confirmed">確定</option>
          <option value="pending">未確定</option>
          <option value="needs_review">要確認</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn secondary" onclick="closeEditModal()">キャンセル</button>
        <button id="btnSaveEdit" class="btn primary" onclick="saveEdit()">保存</button>
      </div>
    </div>
  </div>

  <?!= include('ui_app'); ?>
</body>
</html>
